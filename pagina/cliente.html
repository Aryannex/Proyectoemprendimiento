<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado de tus Pedidos - Momentos Eternos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado -->
  <header class="navbar">
    <div class="logo">
      <h1>Mis Pedidos</h1>
    </div>
    <nav>
      <a href="index.html" class="btn-hero" style="background: var(--color-secundario);">Volver al Inicio</a>
    </nav>
  </header>

  <!-- Contenido Principal -->
  <main class="seccion-formulario" style="max-width: 900px;">
    <section>
      <h2>Seguimiento de Estado</h2>
      <p class="subtitulo">Aquí puedes consultar el progreso actual de tus lienzos personalizados.</p>

      <!-- Contenedor dinámico de los pedidos del cliente -->
      <section id="misPedidos" class="formulario" style="background: var(--bg-resumen);">
        <!-- El seguimiento se cargarán aquí desde JavaScript -->
      </section>
    </section>
  </main>

  <!-- Pie de página -->
  <footer class="footer">
    <p>&copy; 2026 Momentos eternos. Todos los derechos reservados.</p>
  </footer>

  <script>
    const contenedorCliente = document.getElementById('misPedidos');
    let pedidos = JSON.parse(localStorage.getItem('pedidosLienzos')) || [];

    if (pedidos.length === 0) {
      contenedorCliente.innerHTML = '<p>No tienes ningún pedido registrado en este navegador.</p>';
    } else {
      pedidos.forEach(pedido => {
        const articulo = document.createElement('article');
        articulo.style.cssText = "border: 1px solid var(--color-primario); padding: 20px; margin-bottom: 20px; border-radius: 8px; background: #FFF7F5;";
        articulo.innerHTML = `
          <h3>Destinatario: ${pedido.nombre}</h3>
          <p><strong>Costo Total:</strong> ${pedido.total}</p>
          <p><strong>Estado del Lienzo:</strong> <span style="color: var(--color-primario); font-weight: bold;">${pedido.estado}</span></p>
        `;
        contenedorCliente.appendChild(articulo);
      });
    }
  </script>
</body>
</html>
